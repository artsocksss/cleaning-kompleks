    <rect x="90" y="290" width="1260" height="86" rx="22" fill="white"/><text x="120" y="344" font-size="24" font-weight="900" fill="#122019">Підтримуюче прибирання</text><rect x="520" y="314" width="150" height="38" rx="19" fill="#173a24"/><text x="545" y="340" font-size="18" font-weight="900" fill="white">від 1 200 ₴</text><text x="720" y="340" font-size="19" fill="#657169">2 клінера · до 3 годин · еко-засоби</text>
