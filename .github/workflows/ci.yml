name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -s README.md
          find . -type f -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -c 'test -s "$0"'
          echo "Repository validation passed."
